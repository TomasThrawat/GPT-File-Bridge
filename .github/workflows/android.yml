name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gpt-file-bridge-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android CLI
        shell: bash
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/android" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          android sdk install platforms/android-37 build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Unit tests
        run: gradle testDebugUnitTest --warning-mode=all

      - name: Build debug APK
        run: gradle assembleDebug --warning-mode=all

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: gpt-file-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
